openapi: 3.0.0
info:
  title: Citas API - Appointments
  description: API endpoints for appointment management including scheduling, status updates, and availability checking
  version: 1.0.0
  contact:
    name: Citas Development Team
    email: dev@citas.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.citas.com
    description: Production server

tags:
  - name: Appointments
    description: Appointment management endpoints
  - name: Availability
    description: Availability checking endpoints

paths:
  /v1/appointments:
    get:
      tags:
        - Appointments
      summary: List Appointments
      description: Get a paginated list of appointments with optional filtering
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
            description: Filter by start date (inclusive)
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
            description: Filter by end date (inclusive)
        - name: professional_id
          in: query
          schema:
            type: string
            format: uuid
            description: Filter by professional
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]
            description: Filter by status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100

      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      appointments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Appointment'
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer

    post:
      tags:
        - Appointments
      summary: Create Appointment
      description: Create a new appointment with customer, service, and professional
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - service_id
                - start_time
              properties:
                customer_id:
                  type: string
                  format: uuid
                  description: Customer ID
                service_id:
                  type: string
                  format: uuid
                  description: Service ID
                professional_id:
                  type: string
                  format: uuid
                  description: Professional ID (optional)
                start_time:
                  type: string
                  format: date-time
                  description: Appointment start time
                notes:
                  type: string
                  description: Appointment notes

      responses:
        '201':
          description: Appointment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '409':
          description: Appointment conflicts with existing appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/appointments/{id}:
    get:
      tags:
        - Appointments
      summary: Get Appointment
      description: Get a specific appointment by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Appointment found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

    put:
      tags:
        - Appointments
      summary: Update Appointment
      description: Update an appointment completely
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: string
                  format: uuid
                service_id:
                  type: string
                  format: uuid
                professional_id:
                  type: string
                  format: uuid
                start_time:
                  type: string
                  format: date-time
                notes:
                  type: string

      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

    delete:
      tags:
        - Appointments
      summary: Cancel Appointment
      description: Cancel an appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

  /v1/appointments/{id}/status:
    patch:
      tags:
        - Appointments
      summary: Update Appointment Status
      description: Update the status of an appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]

      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found

  /v1/appointments/{id}/availability:
    get:
      tags:
        - Appointments
      summary: Check Appointment Availability
      description: Check if a professional is available at a specific time
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Professional ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - start_time
                - duration
              properties:
                start_time:
                  type: string
                  format: date-time
                duration:
                  type: integer
                  description: Duration in minutes

      responses:
        '200':
          description: Availability check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  available:
                    type: boolean

  /v1/availability/professionals/{professionalId}:
    get:
      tags:
        - Availability
      summary: Get Professional Availability
      description: Get the availability of a professional for a date range
      security:
        - bearerAuth: []
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time

      responses:
        '200':
          description: Professional availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  professional_id:
                    type: string
                  date_range:
                    type: object
                    properties:
                      start_date:
                        type: string
                      end_date:
                        type: string
                  blocked_times:
                    type: array
                    items:
                      type: object
                      properties:
                        start_time:
                          type: string
                          format: date-time
                        end_time:
                          type: string
                          format: date-time
                        status:
                          type: string

  /v1/availability/dates/{professionalId}:
    get:
      tags:
        - Availability
      summary: Get Available Dates
      description: Get dates when a professional has availability
      security:
        - bearerAuth: []
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Available dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  professional_id:
                    type: string
                  available_dates:
                    type: array
                    items:
                      type: string

  /v1/availability/times/{professionalId}:
    get:
      tags:
        - Availability
      summary: Get Available Times
      description: Get available time slots for a specific date
      security:
        - bearerAuth: []
      parameters:
        - name: professionalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date

      responses:
        '200':
          description: Available time slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  professional_id:
                    type: string
                  date:
                    type: string
                  available_times:
                    type: array
                    items:
                      type: string

  /v1/availability/schedule:
    get:
      tags:
        - Availability
      summary: Get Business Schedule
      description: Get the business schedule for all days of the week
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Business schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tenant_id:
                    type: string
                  schedule:
                    type: object
                    properties:
                      mon:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "18:00"
                      tue:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "18:00"
                      wed:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "18:00"
                      thu:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "18:00"
                      fri:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "18:00"
                      sat:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "09:00"
                          end:
                            type: string
                            example: "14:00"
                      sun:
                        type: object
                        properties:
                          start:
                            type: string
                            example: "00:00"
                          end:
                            type: string
                            example: "00:00"

    post:
      tags:
        - Availability
      summary: Update Business Schedule
      description: Update the business schedule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule:
                  type: object
                  properties:
                    mon:
                      type: object
                      properties:
                        start:
                          type: string
                        end:
                          type: string

      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        professional_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]
        notes:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'
        service:
          $ref: '#/components/schemas/Service'
        professional:
          $ref: '#/components/schemas/Professional'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        duration:
          type: integer

    Professional:
      type: object
      properties:
        id:
          type: string
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "APPOINTMENT_NOT_FOUND"
            message:
              type: string
              example: "Appointment not found"

    StatusEnum:
      type: string
      enum: [PENDING, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]

    ErrorCodes:
      type: string
      enum:
        - APPOINTMENT_NOT_FOUND
        - CUSTOMER_NOT_FOUND
        - SERVICE_NOT_FOUND
        - APPOINTMENT_CONFLICT
        - INVALID_STATUS