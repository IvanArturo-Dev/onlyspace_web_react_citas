# ============================================================================
# OnlySpace - Nginx reverse proxy + SPA + HTTPS
# ----------------------------------------------------------------------------
# IMPORTANTE: reemplaza el placeholder onlyspace.site por tu dominio real.
#   - server_name       -> tu dominio (ej. onlyspace.app www.onlyspace.app)
#   - ssl_certificate*  -> las rutas de Let's Encrypt para ese dominio
#     (/etc/letsencrypt/live/onlyspace.site/...). El nombre de la carpeta "live/onlyspace.site"
#     coincide con el primer -d que pasaste a certbot.
#
# Antes de tener certificado (DNS aun sin propagar), el bloque 443 no puede
# arrancar porque los archivos del cert no existen. Emite primero el cert con
# certbot en modo webroot (ver nginx/README.md) y luego habilita/recarga.
# ============================================================================

# --- HTTP (puerto 80): retos ACME + redireccion a HTTPS ---------------------
server {
    listen 80;
    listen [::]:80;

    # server_name: reemplaza onlyspace.site por tu dominio real (ej. onlyspace.app)
    server_name onlyspace.site www.onlyspace.site;

    # Reto ACME de Let's Encrypt (certbot --webroot). Debe servirse por HTTP.
    # El webroot /var/www/certbot se monta como volumen compartido con certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demas se fuerza a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (puerto 443): TLS + SPA + reverse proxy --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # server_name: reemplaza onlyspace.site por tu dominio real (ej. onlyspace.app)
    server_name onlyspace.site www.onlyspace.site;

    # Certificado Let's Encrypt. Reemplaza onlyspace.site por el nombre real; estas
    # rutas las genera certbot en /etc/letsencrypt/live/<onlyspace.site>/.
    ssl_certificate     /etc/letsencrypt/live/onlyspace.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onlyspace.site/privkey.pem;

    # Buenas practicas TLS basicas.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Frontend estatico (build de Vite).
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad basicos.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Limite de tamano de subida (ajusta segun necesidades del backend).
    client_max_body_size 10m;

    # --- API del backend (Express escucha en el puerto 3000) ---
    # Incluye /v1/auth, /v1/me, /v1/webhooks/mercadopago, etc.
    location /v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check del backend ---
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA fallback (React Router): sirve index.html en rutas del cliente ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
